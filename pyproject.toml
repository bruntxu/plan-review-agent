[project]
name = "plan-review-agent"
version = "0.1.0"
description = "应急预案智能审查 Agent：规则检查 + 大模型（脱敏后）+ LangGraph 编排 + FastAPI 服务"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
